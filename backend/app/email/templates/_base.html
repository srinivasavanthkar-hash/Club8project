<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background:#f5f5f8;font-family:Segoe UI,Arial,sans-serif;color:#1c1a33;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f8;padding:24px 12px;">
<tr><td align="center">
<table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;background:#ffffff;border:1px solid #dedcec;border-radius:8px;">
<tr><td style="padding:24px 28px 8px;border-bottom:3px solid {{ brand.accent }};">
<img src="{{ brand.logo_url }}" alt="{{ brand.name }}" width="120" style="display:block;border:0;max-width:120px;height:auto;">
</td></tr>
<tr><td style="padding:24px 28px;font-size:15px;line-height:1.55;">
{% block body %}{% endblock %}
</td></tr>
<tr><td style="padding:16px 28px 24px;font-size:12px;line-height:1.5;color:#55536e;border-top:1px solid #dedcec;">
This is an automatic message from {{ brand.name }} CRM. Please don't reply to it.<br>
Questions? Contact {{ admin_contact }}.
</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
