[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "club8-crm"
version = "0.1.0"
description = "Club8 Holidays / K8 CRM API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "gunicorn>=22",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "email-validator>=2.2",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "bcrypt>=4.1",
  "pyjwt>=2.9",
  "pyotp>=2.9",
  "httpx>=0.27",  # breached-password range API (k-anonymity)
  "limits>=3.13",  # per-account rate limits (slowapi uses it too)
  "slowapi>=0.1.9",
  "cryptography>=43",
  "python-multipart>=0.0.9",
  "jinja2>=3.1",
  "weasyprint>=62",
  "extract-msg>=0.48",
  "python-magic>=0.4.27",
  "openpyxl>=3.1",
  "dramatiq[redis]>=1.17",
  "redis>=5",
  "azure-identity>=1.17",
  "azure-keyvault-secrets>=4.8",
  "azure-keyvault-keys>=4.9",
  "azure-storage-blob>=12.22",
  "aiohttp>=3.9",  # transport for the async Azure SDK clients (blob storage); without it every upload fails
  "azure-communication-email>=1.0",  # password-reset and security emails (managed identity)
  "azure-monitor-opentelemetry>=1.6",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "pytest-timeout==2.4.0",  # CI: a hanging test fails with its name and a stack trace (--timeout in ci.yml)
  "hypothesis>=6.100",
  "factory-boy>=3.3",
  "testcontainers[postgres]>=4.8",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
# brand logos embedded in generated PDFs (copies of frontend/public/brand, kept identical by a test)
app = ["correspondence/brand/*/*.png"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: needs Docker (testcontainers PostgreSQL)"]

[tool.coverage.run]
source = ["app"]
concurrency = ["greenlet", "thread"]
omit = ["app/main.py", "app/jobs/*", "app/core/telemetry.py"]

[tool.coverage.report]
# CI enforces 80% on the service + domain layer (see .github/workflows/ci.yml)
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101", "B008", "RUF012", "UP046", "UP047"]  # PEP 695 generics: keep TypeVar style for Pydantic/mypy

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"alembic/*" = ["E501"]
"app/correspondence/letters.py" = ["E501"]  # HTML template literals

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.*.domain", "app.*.service", "app.core.*"]
strict = true
