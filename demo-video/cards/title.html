<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Club8 CRM demo: title</title>
<style>
  :root { --indigo: #393186; --orange: #EF7F1B; --ink: #1c1a33; --muted: #55536e; --paper: #F7F7FB; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--paper); color: var(--ink); font-family: "Segoe UI", Inter, system-ui, sans-serif;
    display: grid; place-items: center; }
  .card { display: grid; justify-items: center; gap: 44px; text-align: center; animation: rise 900ms ease-out both; }
  .logos { display: flex; align-items: center; gap: 72px; background: #fff; padding: 36px 64px; border-radius: 18px;
    box-shadow: 0 18px 50px rgba(28, 26, 51, .12); }
  .logos img { height: 150px; width: auto; }
  .k8 { height: 150px; width: 270px; object-fit: cover; object-position: 0 0; }
  .rule { width: 120px; height: 5px; border-radius: 3px; background: var(--orange); }
  h1 { margin: 0; font-size: 64px; font-weight: 700; letter-spacing: -.01em; color: var(--indigo); }
  h1 span { display: block; font-size: 40px; font-weight: 500; color: var(--ink); margin-top: 14px; }
  p { margin: 0; font-size: 26px; color: var(--muted); }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
  <div class="card">
    <div class="logos">
      <img src="../../frontend/public/brand/club8/club8-logo.png" alt="Club8 Holidays">
      <img class="k8" src="../../frontend/public/brand/k8/k8-logo.png" alt="K8">
    </div>
    <div class="rule"></div>
    <h1>Club8 CRM<span>from street lead to confirmed holiday</span></h1>
    <p>Demo with fictitious data</p>
  </div>
</body>
</html>
