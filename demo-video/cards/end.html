<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Club8 CRM demo: end</title>
<style>
  :root { --indigo: #393186; --orange: #EF7F1B; --ink: #1c1a33; --muted: #55536e; --paper: #F7F7FB; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--paper); color: var(--ink); font-family: "Segoe UI", Inter, system-ui, sans-serif;
    display: grid; place-items: center; }
  .card { width: 1200px; display: grid; grid-template-columns: 300px 1fr; gap: 72px; align-items: center;
    animation: rise 900ms ease-out both; }
  .brand { display: grid; gap: 28px; justify-items: center; background: #fff; padding: 36px 28px; border-radius: 18px;
    box-shadow: 0 18px 50px rgba(28, 26, 51, .12); }
  .brand img { width: 220px; height: auto; }
  .k8 { width: 220px; height: 122px; object-fit: cover; object-position: 0 0; }
  h1 { margin: 0 0 28px; font-size: 64px; font-weight: 700; color: var(--indigo); }
  ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 22px; }
  li { display: grid; grid-template-columns: 22px 1fr; gap: 20px; align-items: baseline; font-size: 34px; line-height: 1.3; }
  li::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--orange); transform: translateY(-3px); }
  .by { margin-top: 48px; padding-top: 22px; border-top: 3px solid var(--orange); font-size: 26px; color: var(--muted); }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <img src="../../frontend/public/brand/club8/club8-logo.png" alt="Club8 Holidays">
      <img class="k8" src="../../frontend/public/brand/k8/k8-logo.png" alt="K8">
    </div>
    <div>
      <h1>Club8 CRM</h1>
      <ul>
        <li>One system for both brands, Club8 Holidays and K8</li>
        <li>Every change on record, with who, when and why</li>
        <li>ASF rules enforced before any stay is confirmed</li>
      </ul>
      <p class="by">Prepared by Rupashree.S</p>
    </div>
  </div>
</body>
</html>
