name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y libmagic1
          python -c "import tomllib;d=tomllib.load(open('pyproject.toml','rb'))['project'];print('\n'.join(d['dependencies']+d['optional-dependencies']['dev']))" > req.txt
          pip install -r req.txt
      - name: Lint (ruff)
        run: ruff check app tests alembic && ruff format --check app tests alembic
      - name: Type check (mypy, strict on service/domain/core)
        run: mypy app
      - name: Tests (unit + integration on real PostgreSQL via testcontainers)
        # 5 minutes per test: a hang fails with the test's name and a stack trace instead of running for hours
        run: >
          pytest -q --cov=app --cov-report=xml --cov-report=term
          --junitxml=junit.xml --timeout=300 --timeout-method=thread
      - name: Enforce >= 80% coverage on the service + domain layer
        run: >
          coverage report --fail-under=80
          --include="app/*/service.py,app/*/domain.py,app/members/duplicates.py,app/correspondence/documents.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: backend-test-results, path: "backend/junit.xml\nbackend/coverage.xml" }

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint # ESLint + design-token check (no hard-coded colours / font sizes)
      - run: npm run check:contrast # WCAG AA contrast of the design tokens
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env: { NEXT_TELEMETRY_DISABLED: "1" }

  # Known-vulnerable dependencies fail the build (Next.js CVE-2025-66478 shipped unnoticed before this job existed).
  # npm: high or critical findings in the production dependencies (what ships). The full audit, including build and
  # lint tools, runs as a non-blocking step: picomatch GHSA-fc5q-39xc-vjpf (dev tools only) has no fixed version yet.
  # Make the full audit blocking again as soon as one exists (docs/PROGRESS.md; audit-weekly.yml checks every week).
  # pip-audit has no severity filter, so any known vulnerability fails; accept a reviewed one with
  # `--ignore-vuln <ID>` and a comment saying why.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: npm audit (frontend production dependencies, high or critical)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (frontend, all dependencies incl. dev tools; non-blocking, see GHSA-fc5q-39xc-vjpf)
        working-directory: frontend
        continue-on-error: true
        run: npm audit --audit-level=high
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: pip-audit (backend runtime + dev dependencies)
        working-directory: backend
        run: |
          python -c "import tomllib;d=tomllib.load(open('pyproject.toml','rb'))['project'];print('\n'.join(d['dependencies']+d['optional-dependencies']['dev']))" > req.txt
          pip install pip-audit==2.10.1
          pip-audit -r req.txt --progress-spinner off

  e2e:
    needs: [backend, frontend, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Start the full stack (docker compose)
        run: docker compose up -d --build --wait postgres redis azurite mailpit && docker compose up -d --build api web worker
        env: { CRM_E2E_TARGET: "true" } # throwaway stack: the data-writing specs may run
      - name: Seed demo master data + users (fictitious)
        run: bash scripts/seed-demo.sh --no-scenario
      - name: Section 14 demo scenario through the API
        run: docker compose run --rm api python -m app.demo_cli --base-url http://web:3000
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Playwright (Section 14 demo, axe-core a11y scan, visual regression)
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
        env: { E2E_BASE_URL: "http://localhost:3000", MAILPIT_URL: "http://localhost:8025", CI: "1" }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: frontend/playwright-report }
      - uses: actions/upload-artifact@v4 # Linux visual baselines written on first run: commit them to lock the look
        if: always()
        with: { name: visual-baselines-linux, path: frontend/e2e/visual.spec.ts-snapshots/*-linux.png }
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color api web | tail -500

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: infra/terraform } }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.9.8" }
      - run: terraform fmt -check -recursive
      - name: Validate each environment
        run: |
          for env in dev staging prod; do
            (cd envs/$env && terraform init -backend=false -input=false && terraform validate)
          done
