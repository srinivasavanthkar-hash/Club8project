name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - name: Install
        run: |
          sudo apt-get update && sudo apt-get install -y libmagic1
          python -c "import tomllib;d=tomllib.load(open('pyproject.toml','rb'))['project'];print('\n'.join(d['dependencies']+d['optional-dependencies']['dev']))" > req.txt
          pip install -r req.txt
      - name: Lint (ruff)
        run: ruff check app tests alembic && ruff format --check app tests alembic
      - name: Type check (mypy, strict on service/domain/core)
        run: mypy app
      - name: Tests (unit + integration on real PostgreSQL via testcontainers)
        run: >
          pytest -q --cov=app --cov-report=xml --cov-report=term
          --junitxml=junit.xml
      - name: Enforce >= 80% coverage on the service + domain layer
        run: >
          coverage report --fail-under=80
          --include="app/*/service.py,app/*/domain.py,app/members/duplicates.py,app/correspondence/documents.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: backend-test-results, path: "backend/junit.xml\nbackend/coverage.xml" }

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint # ESLint + design-token check (no hard-coded colours / font sizes)
      - run: npm run check:contrast # WCAG AA contrast of the design tokens
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env: { NEXT_TELEMETRY_DISABLED: "1" }

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the full stack (docker compose)
        run: docker compose up -d --build --wait postgres redis azurite && docker compose up -d --build api web worker
        env: { CRM_E2E_TARGET: "true" } # throwaway stack: the data-writing specs may run
      - name: Seed demo master data + users (fictitious)
        run: bash scripts/seed-demo.sh --no-scenario
      - name: Section 14 demo scenario through the API
        run: docker compose run --rm api python -m app.demo_cli --base-url http://web:3000
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Playwright (Section 14 demo, axe-core a11y scan, visual regression)
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
        env: { E2E_BASE_URL: "http://localhost:3000", CI: "1" }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: frontend/playwright-report }
      - uses: actions/upload-artifact@v4 # Linux visual baselines written on first run: commit them to lock the look
        if: always()
        with: { name: visual-baselines-linux, path: frontend/e2e/visual.spec.ts-snapshots/*-linux.png }
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color api web | tail -500

  terraform:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: infra/terraform } }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.9.8" }
      - run: terraform fmt -check -recursive
      - name: Validate each environment
        run: |
          for env in dev staging prod; do
            (cd envs/$env && terraform init -backend=false -input=false && terraform validate)
          done
