# Local development stack. Development-only credentials below; production secrets live in Azure Key Vault.
name: club8-crm

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crm_owner
      POSTGRES_PASSWORD: crm_owner_dev
      POSTGRES_DB: crm
    # Host port, for tools on the host only (the services use postgres:5432 inside the network). Set
    # CRM_PG_HOST_PORT in a git-ignored .env next to this file when 5432 is taken (e.g. a system PostgreSQL).
    ports: ["${CRM_PG_HOST_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/local/init-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_owner -d crm"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.33.0
    # --skipApiVersionCheck: the Azure SDK in the image requests a newer blob API version than this Azurite knows
    # (uploads fail with a 500 otherwise); the demo-video recorder starts Azurite the same way. Real Azure is unaffected.
    command: azurite-blob --blobHost 0.0.0.0 --loose --skipApiVersionCheck
    ports: ["10000:10000"]

  # Local / CI mail catcher: every email the CRM sends appears at http://localhost:8025 (nothing leaves the machine)
  mailpit:
    image: axllent/mailpit:v1.32.0
    ports: ["8025:8025", "1025:1025"]

  clamav:
    image: clamav/clamav:1.4
    ports: ["3310:3310"]
    profiles: ["scan"]

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: &backend-env
      CRM_ENV: local
      CRM_DATABASE_URL: postgresql+asyncpg://crm_app:crm_app_dev@postgres:5432/crm
      CRM_MIGRATION_DATABASE_URL: postgresql+asyncpg://crm_owner:crm_owner_dev@postgres:5432/crm
      CRM_REDIS_URL: redis://redis:6379/0
      CRM_BLOB_PROVIDER: azurite
      CRM_BLOB_ACCOUNT_URL: http://127.0.0.1:10000/devstoreaccount1
      # Azurite's published, well-known development key (not a secret)
      CRM_BLOB_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
      CRM_VIRUS_SCAN_PROVIDER: none
      CRM_COOKIE_SECURE: "false"
      CRM_JWT_SIGNING_KEY: local-dev-only-signing-key-change-me-please-0123456789
      # Local / CI only: the Playwright suites sign in many times a minute from one IP. Azure uses the strict
      # defaults (10/min per IP, 5/min per account; app/core/config.py).
      CRM_RATE_LIMIT_LOGIN: "300/minute"
      CRM_RATE_LIMIT_LOGIN_ACCOUNT: "60/minute"
      # Only a throwaway CI stack sets this (ci.yml): the Playwright specs that write data refuse to run otherwise,
      # so they can never write to a demo database started from this file.
      CRM_E2E_TARGET: "${CRM_E2E_TARGET:-false}"
      # Throwaway CI stack only (ci.yml): a fixed business date so date-dependent results do not drift. Empty = real date.
      CRM_FIXED_TODAY: "${CRM_FIXED_TODAY:-}"
      # Email: Mailpit (above); sent by the worker after commit, with retries. Links use the public web address.
      CRM_EMAIL_PROVIDER: smtp
      CRM_SMTP_HOST: mailpit
      CRM_SMTP_PORT: "1025"
      CRM_EMAIL_DISPATCH: worker
      CRM_APP_BASE_URL: http://localhost:3000
      # Designated super-admin for the ADMIN-reset fallback (docs/DECISIONS.md D-PW-3). Empty = no fallback.
      CRM_SUPER_ADMIN_USERNAME: ""
    depends_on:
      postgres: {condition: service_healthy}

  api:
    build: ./backend
    environment: *backend-env
    ports: ["8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_started}
      azurite: {condition: service_started}

  worker:
    build: ./backend
    command: ["dramatiq", "app.jobs.tasks", "--processes", "1", "--threads", "2"]
    environment: *backend-env
    # the image's HEALTHCHECK polls the API on :8000, which this container does not run
    healthcheck: {disable: true}
    depends_on:
      migrate: {condition: service_completed_successfully}
      mailpit: {condition: service_started}

  scheduler:
    build: ./backend
    command: ["python", "-m", "app.jobs.scheduler"]
    environment: *backend-env
    healthcheck: {disable: true}  # as for the worker: no API in this container
    depends_on: [worker]

  web:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://api:8000  # rewrites are resolved at build time
        NEXT_PUBLIC_DEFAULT_BRAND: club8  # app shell theme: club8 | k8
    environment:
      CRM_ENV: local  # read per request: shows the DEV ribbon (staging -> STAGING, prod -> none)
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
